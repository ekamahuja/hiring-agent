<!-- Representative LinkedIn logged-out guest job fragment
     (/jobs-guest/jobs/api/jobPosting/<id>). Encodes the markup contract
     parse_job relies on; the live smoke test catches real drift. -->
<section class="top-card-layout">
  <h2 class="top-card-layout__title">Backend Engineer</h2>
  <div class="top-card-layout__second-subline">
    <a class="topcard__org-name-link" href="https://www.linkedin.com/company/acme">Acme Corp</a>
    <span class="topcard__flavor topcard__flavor--bullet">Remote, United States</span>
  </div>
  <span class="posted-time-ago__text">1 week ago</span>
</section>
<div class="description__text">
  <section class="show-more-less-html">
    <div class="show-more-less-html__markup">
      <p>We are hiring a Backend Engineer to build scalable APIs.</p>
      <ul><li>Python and FastAPI</li><li>PostgreSQL</li></ul>
    </div>
  </section>
</div>
<ul class="description__job-criteria-list">
  <li class="description__job-criteria-item">
    <h3 class="description__job-criteria-subheader">Seniority level</h3>
    <span class="description__job-criteria-text">Mid-Senior level</span>
  </li>
  <li class="description__job-criteria-item">
    <h3 class="description__job-criteria-subheader">Employment type</h3>
    <span class="description__job-criteria-text">Full-time</span>
  </li>
</ul>
